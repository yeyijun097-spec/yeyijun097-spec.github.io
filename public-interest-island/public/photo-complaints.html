<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片录单 · 客满运营台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/workbench.css?v=20260728-1">
</head>
<body><div class="workbench">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-symbol">KM</div><div class="brand-copy"><strong>客满运营台</strong><span>OPERATIONS CONSOLE</span></div></div>
    <nav class="sidebar-nav" aria-label="主菜单">
      <a class="sidebar-link" href="/"><i class="fa fa-search"></i><span>用户信息查询</span></a>
      <a class="sidebar-link active" href="/photo-complaints" aria-current="page"><i class="fa fa-camera"></i><span>图片录单</span></a>
      <a class="sidebar-link" href="/pipeline"><i class="fa fa-tasks"></i><span>敏感词批量处理</span></a>
    </nav>
    <div class="sidebar-footer"><a id="admin-link" class="account-admin-link hidden" href="/admin"><i class="fa fa-users"></i><span>账号管理 / 新建账号</span></a><div class="account-row"><div class="account-avatar">管</div><div class="account-copy"><strong id="user-name">当前账号</strong><span>图片录单</span></div><button id="logout" class="logout-button"><i class="fa fa-sign-out"></i></button></div></div>
  </aside>
  <main class="main-area"><header class="topbar"><div><h1 class="page-title">图片识别与投诉录单</h1><p class="page-subtitle">识别、复核、自动填表，最终提交始终由你确认</p></div><span class="online-pill">原图识别后立即删除</span></header>
    <div class="content-shell">
      <section class="panel"><div class="panel-heading"><div><h2>上传投诉图片</h2><p>支持 JPG、PNG、BMP；单张不超过 8MB，一次最多 10 张。</p></div></div>
        <div class="panel-body"><div id="drop" class="rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 p-8 text-center"><i class="fa fa-cloud-upload text-4xl text-blue-500"></i><p class="mt-3 font-medium">拖入图片，或点击选择</p><input id="files" class="mt-4" type="file" accept="image/jpeg,image/png,image/bmp" multiple><p id="selection" class="mt-2 text-sm text-slate-500"></p><button id="upload" class="btn btn-primary mt-4">开始识别</button></div><div id="message" class="mt-4 hidden rounded-md px-4 py-3 text-sm"></div></div>
      </section>
      <section class="panel mt-5"><div class="panel-heading"><div><h2>录单任务</h2><p>任务保留 3 天；页面刷新或重新登录后可继续。</p></div><button id="refresh" class="btn btn-secondary"><i class="fa fa-refresh"></i> 刷新</button></div><div id="tasks" class="panel-body space-y-4"><p class="text-slate-500">正在读取任务...</p></div></section>
    </div>
  </main>
</div>
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-5"><div class="max-h-[92vh] w-full max-w-5xl overflow-auto rounded-xl bg-white shadow-2xl"><div class="flex items-center justify-between border-b p-5"><div><h2 id="modal-title" class="text-xl font-semibold">任务复核</h2><p id="modal-subtitle" class="text-sm text-slate-500"></p></div><button id="modal-close" class="text-2xl text-slate-500">×</button></div><div id="modal-body" class="p-5"></div></div></div>
<script>
const $=id=>document.getElementById(id); let csrf="", tasks=[],shownShotTaskId="",shownShotKind="",activeReviewBatch=[],activeReviewIndex=-1,lastUploadedBatchId=sessionStorage.getItem('photoComplaintLastBatch')||"";const problemOptionCache=new Map();const autoOpenedConfirmations=new Set();const dismissedConfirmations=new Set(JSON.parse(sessionStorage.getItem('photoComplaintDismissedConfirmations')||'[]'));
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opt={}){const h={...(opt.headers||{})};if(csrf)h['x-csrf-token']=csrf;const r=await fetch(url,{credentials:'same-origin',...opt,headers:h});const t=await r.text();let b={};try{b=t?JSON.parse(t):{}}catch{}if(!r.ok)throw new Error(b.error||'请求失败');return b}
function msg(text,error=false){const el=$('message');el.textContent=text;el.className=`mt-4 rounded-md px-4 py-3 text-sm ${error?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-700'}`;el.classList.toggle('hidden',!text)}
async function loadSession(){const s=await api('/api/session');csrf=s.csrfToken;$('user-name').textContent=s.user.username;if(s.user.role==='admin')$('admin-link').classList.remove('hidden');await loadTasks()}
async function loadTasks(){const b=await api('/api/photo-complaints');tasks=b.data||[];if(shownShotKind==='login'){const active=tasks.find(t=>t.id===shownShotTaskId);if(!active||active.status!=='waiting_login')closeModal()}renderTasks();const ready=tasks.find(t=>t.status==='awaiting_confirmation'&&!autoOpenedConfirmations.has(t.id)&&!dismissedConfirmations.has(t.id));if(ready&&$('modal').classList.contains('hidden')){autoOpenedConfirmations.add(ready.id);openSubmitConfirmation(ready.id)}}
function isLoginLeader(t){if(t.status!=='waiting_login')return false;const batch=t.data?.batchId;const waiting=tasks.filter(x=>x.status==='waiting_login'&&x.data?.batchId===batch).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));return waiting[0]?.id===t.id}
function taskCard(t){const template=t.data?.template==='petition'?'信访':t.data?.template||'待识别',leader=isLoginLeader(t);return `<article class="rounded-xl border border-slate-200 bg-white p-4"><div class="flex flex-wrap items-center justify-between gap-3"><div><div class="font-medium">${esc(t.originalName)}</div><div class="mt-1 text-xs text-slate-500">${new Date(t.createdAt).toLocaleString()} · ${esc(template)}</div></div><span class="rounded-full px-3 py-1 text-sm ${statusClass(t.status)}">${esc(t.statusLabel)}${t.queuePosition?`（第${t.queuePosition}位）`:''}</span></div>${t.status==='waiting_login'?`<p class="mt-3 rounded bg-blue-50 p-2 text-sm text-blue-700">${leader?'本批次只需扫描此二维码；成功后系统会自动继续处理其余图片。':'正在共用本批次的扫码登录会话，无需再次扫码。'}</p>`:t.error?`<p class="mt-3 rounded bg-red-50 p-2 text-sm text-red-700">${esc(t.error)}</p>`:''}<div class="mt-4 flex flex-wrap gap-2">${buttons(t)}</div></article>`}
function renderTasks(){
  const root=$('tasks');if(!tasks.length){root.innerHTML='<p class="text-slate-500">暂无任务，请先上传图片。</p>';return}
  const batches=tasks.filter(t=>t.data?.batchId);if(!lastUploadedBatchId&&batches.length)lastUploadedBatchId=batches[0].data.batchId;
  const current=lastUploadedBatchId?tasks.filter(t=>t.data?.batchId===lastUploadedBatchId):[],history=tasks.filter(t=>!current.includes(t));
  const reviewable=current.filter(t=>['review','waiting_login'].includes(t.status));
  const currentBlock=current.length?`<section class="rounded-xl border border-blue-200 bg-blue-50/60 p-4"><div class="mb-4 flex flex-wrap items-center justify-between gap-3"><div><h3 class="font-semibold text-slate-900">本次上传 · ${current.length} 张</h3><p class="mt-1 text-sm text-slate-500">${new Date(current[current.length-1].createdAt).toLocaleString()}，已与历史任务分开</p></div><button type="button" class="btn btn-primary" data-action="batch-review" data-batch-id="${esc(lastUploadedBatchId)}" ${reviewable.length?'':'disabled'}><i class="fa fa-check-square-o"></i> 批量复核（${reviewable.length}/${current.length}）</button></div><div class="space-y-3">${current.map(taskCard).join('')}</div></section>`:'';
  const historyBlock=history.length?`<details class="rounded-xl border border-slate-200 bg-slate-50" ${current.length?'':'open'}><summary class="cursor-pointer select-none p-4 font-semibold text-slate-700">历史任务（${history.length}）</summary><div class="space-y-3 border-t border-slate-200 p-4">${history.map(taskCard).join('')}</div></details>`:'';
  root.innerHTML=`<div class="space-y-5">${currentBlock}${historyBlock}</div>`;
}
function statusClass(s){return s==='completed'?'bg-emerald-100 text-emerald-700':s==='failed'||s==='manual_check'?'bg-red-100 text-red-700':s==='review'||s==='awaiting_confirmation'?'bg-amber-100 text-amber-700':'bg-blue-100 text-blue-700'}
function screenshotPresentation(status){if(['failed','manual_check'].includes(status))return{button:'查看失败现场',title:'自动填表失败现场',subtitle:'这是云端浏览器停止时的兴趣岛页面，可据此核对具体卡点。'};if(status==='queued')return{button:'查看待处理现场',title:'待处理表单现场',subtitle:'表单已经填写，任务正在等待后端处理。'};if(status==='submitting')return{button:'查看提交前现场',title:'提交前表单现场',subtitle:'这是工单提交前的表单记录，任务正在提交。'};if(status==='completed')return{button:'查看提交前截图',title:'提交前表单截图',subtitle:'这是工单创建前保留的表单记录。'};return{button:'查看表单现场',title:'兴趣岛填表截图',subtitle:'请核对兴趣岛表单内容。'}}
function buttons(t){const id=esc(t.id);let a=[];if(['review','waiting_login'].includes(t.status))a.push(`<button type="button" class="btn btn-primary" data-action="review" data-task-id="${id}">复核字段</button>`);if(t.status==='waiting_login'&&isLoginLeader(t))a.push(`<button type="button" class="btn btn-secondary" data-action="show-shot" data-task-id="${id}" data-kind="login">查看本批次扫码页</button><button type="button" class="btn btn-secondary" data-action="task-action" data-task-id="${id}" data-name="resume-login">立即检测登录状态</button>`);if(t.status==='awaiting_confirmation')a.push(`<button type="button" class="btn btn-secondary" data-action="show-shot" data-task-id="${id}" data-kind="form">查看填表截图</button><button type="button" class="btn btn-primary" data-action="open-submit" data-task-id="${id}">核对并创建工单</button>`);else if(t.formScreenshotAvailable)a.push(`<button type="button" class="btn btn-secondary" data-action="show-shot" data-task-id="${id}" data-kind="form">${screenshotPresentation(t.status).button}</button>`);if(!['completed','cancelled'].includes(t.status))a.push(`<button type="button" class="btn btn-secondary" data-action="remove-task" data-task-id="${id}">取消</button>`);return a.join('')}
function startBatchReview(batchId){activeReviewBatch=tasks.filter(t=>t.data?.batchId===batchId&&['review','waiting_login'].includes(t.status)).map(t=>t.id);activeReviewIndex=0;if(!activeReviewBatch.length)return msg('本批次暂无待复核任务',true);review(activeReviewBatch[0],true)}
function moveBatchReview(delta){const next=activeReviewIndex+delta;if(next<0||next>=activeReviewBatch.length)return;activeReviewIndex=next;review(activeReviewBatch[next],true)}
function review(id,keepBatch=false){
  if(!keepBatch){activeReviewBatch=[];activeReviewIndex=-1}else activeReviewIndex=Math.max(0,activeReviewBatch.indexOf(id));
  const t=tasks.find(x=>x.id===id),d=t.data||{},chosen=d.problemLabels||[],orders=d.orderCandidates||[],users=d.userCandidates||[];
  $('modal-title').textContent='投诉内容';
  $('modal-subtitle').textContent=d.detailsTruncated?`投诉详情原 ${d.detailsOriginalLength} 字，已按兴趣岛限制截取前500字`:'字段及顺序与兴趣岛新建投诉工单一致，请逐项确认';
  const option=(value,current)=>`<option value="${esc(value)}" ${String(value)===String(current)?'selected':''}>${esc(value)}</option>`;
  const batchNav=activeReviewBatch.length?`<div class="mb-5 flex flex-wrap items-center justify-between gap-3 rounded-lg border border-blue-200 bg-blue-50 p-3"><button type="button" class="btn btn-secondary" data-action="move-batch" data-delta="-1" ${activeReviewIndex===0?'disabled':''}>← 上一张</button><div class="text-center"><strong>批量复核 ${activeReviewIndex+1}/${activeReviewBatch.length}</strong><p class="text-xs text-slate-500">左右切换不会保存当前未确认的修改</p></div><button type="button" class="btn btn-secondary" data-action="move-batch" data-delta="1" ${activeReviewIndex===activeReviewBatch.length-1?'disabled':''}>下一张 →</button></div>`:'';
  $('modal-body').innerHTML=`${batchNav}<form id="review-form" class="space-y-4">
    <label class="block"><span class="field-label">用户信息 *</span><div class="grid grid-cols-[180px_1fr] gap-3"><select class="field-control" disabled><option>用户ID</option></select><input class="field-control" name="userId" value="${esc(d.userId||'')}" list="user-id-candidates" inputmode="numeric" pattern="[0-9]{6,20}" placeholder="自动查询失败时可人工填写用户ID"></div><datalist id="user-id-candidates">${users.map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist><span class="mt-1 block text-xs ${users.length>1?'font-medium text-amber-700':'text-slate-500'}">${users.length>1?'查询到多个不同用户ID，请从候选中人工核实选择。':d.userId?'已取得用户ID，请人工复核。':'系统会优先按OCR手机号自动查询；若未查到，可在兴趣岛机会管理核实后人工填写。'}</span></label>
    <label class="block"><span class="field-label">关系 *</span><select class="field-control max-w-md" name="relationship">${['本人','家属','子女','未知'].map(v=>option(v,d.relationship||'本人')).join('')}</select></label>
    <label class="block"><span class="field-label">投诉订单类型 *</span><select class="field-control max-w-md" name="orderType">${['正式营','体验营','轻课'].map(v=>option(v,d.orderType||'正式营')).join('')}</select></label>
    <label class="block"><span class="field-label">主投诉订单ID *</span><select class="field-control max-w-xl" name="mainOrderId"><option value="">请选择</option>${d.mainOrderId&&!orders.some(o=>String(o.id)===String(d.mainOrderId))?option(d.mainOrderId,d.mainOrderId):''}${orders.map(o=>option(o.id,d.mainOrderId)+`<!--${esc(o.name||'')}-->`).join('')}</select>${orders.length?'<span class="mt-1 block text-xs text-slate-500">候选订单已按金额、时间、课程名称和订单类型排序</span>':''}</label>
    <label class="block"><span class="field-label">关联订单ID</span><input class="field-control max-w-xl" name="relatedOrderId" value="${esc(d.relatedOrderId||'')}" placeholder="请选择（默认留空）"></label>
    <label class="block"><span class="field-label">第三方投诉单号</span><input class="field-control max-w-xl" name="externalNumber" value="${esc(d.externalNumber||'')}" placeholder="若无第三方投诉单号，请不要填写"></label>
    <fieldset><legend class="field-label">问题标签 *</legend><div class="grid gap-3 md:grid-cols-3">${[0,1,2].map(i=>`<select id="problem-${i}" class="field-control"><option value="">${i+1}级分类</option>${chosen[i]?option(chosen[i],chosen[i]):''}</select>`).join('')}</div><p id="problem-hint" class="mt-2 text-sm ${chosen.length===3?'text-blue-600':'font-medium text-amber-700'}">${chosen.length===3?'已根据投诉内容生成三级分类建议，请人工确认。':'投诉内容未能识别具体三级类，请人工选择'}</p></fieldset>
    <label class="block"><span class="field-label">投诉详情 *</span><textarea class="field-control min-h-40" maxlength="500" name="details">${esc(d.details||'')}</textarea><span class="text-xs text-slate-500">当前 ${[...(d.details||'')].length}/500 字</span></label>
    <label class="block"><span class="field-label">投诉时间 *</span><input class="field-control max-w-md" name="registeredAt" value="${esc(d.registeredAt||'')}" placeholder="YYYY-MM-DD HH:mm:ss"></label>
    <label class="block"><span class="field-label">投诉来源 *</span><select class="field-control max-w-md" name="source"><option value="">请选择</option>${['12345投诉单','12345举报单','12315投诉单','12315举报单','国满件（信访）','广告法'].map(v=>option(v,d.source)).join('')}</select></label>
    <label class="block"><span class="field-label">备注</span><textarea class="field-control" maxlength="500" name="notes" placeholder="请输入备注信息（选填）">${esc(d.notes||'')}</textarea></label>
    <div class="flex justify-end gap-2 pt-2"><button type="button" class="btn btn-secondary" data-action="close-modal">取消</button><button class="btn btn-secondary" type="submit" data-only>仅保存</button><button class="btn btn-primary" type="submit">${activeReviewBatch.length?(activeReviewIndex===activeReviewBatch.length-1?'确认填报并完成复核':'确认填报并下一张'):(d.userId?'保存并自动填表':'保存并登录兴趣岛查询用户ID')}</button></div>
  </form>`;
  openModal();wireProblemSelectors();
  $('review-form').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.target),payload=Object.fromEntries(form),dataOnly=e.submitter.hasAttribute('data-only'),nextId=activeReviewBatch[activeReviewIndex+1];payload.problemLabels=[0,1,2].map(i=>$(`problem-${i}`).value).filter(Boolean);try{await api(`/api/photo-complaints/${id}/review`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});if(!dataOnly)await api(`/api/photo-complaints/${id}/fill`,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});if(activeReviewBatch.length&&!dataOnly&&nextId){activeReviewIndex+=1;await loadTasks();review(nextId,true)}else{closeModal();await loadTasks()}}catch(err){alert(err.message)}};
}
async function loadProblemOptions(level){const selected=[0,1].slice(0,level).map(i=>$(`problem-${i}`).value).filter(Boolean),key=selected.join('/'),hint=$('problem-hint');try{let options=problemOptionCache.get(key);if(!options){const b=await api(`/api/photo-complaints-options/problem-labels?path=${encodeURIComponent(key)}`);options=b.data.options||[];problemOptionCache.set(key,options)}const select=$(`problem-${level}`),current=select.value;select.innerHTML=`<option value="">${level+1}级分类</option>`+options.map(v=>`<option ${v===current?'selected':''}>${esc(v)}</option>`).join('')}catch(e){hint.textContent=e.message}}
async function wireProblemSelectors(){await loadProblemOptions(0);if($('problem-0').value)await loadProblemOptions(1);if($('problem-1').value)await loadProblemOptions(2);$('problem-0').onchange=async()=>{$('problem-1').value='';$('problem-2').value='';await loadProblemOptions(1)};$('problem-1').onchange=async()=>{$('problem-2').value='';await loadProblemOptions(2)}}
    function showShot(id,kind){shownShotTaskId=id;shownShotKind=kind;const t=tasks.find(x=>x.id===id),presentation=screenshotPresentation(t?.status);$('modal-title').textContent=kind==='login'?'兴趣岛扫码登录':t?.status==='awaiting_confirmation'?'兴趣岛填表截图':presentation.title;$('modal-subtitle').textContent=kind==='login'?'扫码成功并检测到管理页面后，本弹窗会自动关闭。':t?.status==='awaiting_confirmation'?'请逐项核对，只有点击“确认提交”后才会提交工单。':presentation.subtitle;$('modal-body').innerHTML=`<img class="mx-auto max-w-full rounded border" src="/api/photo-complaints/${id}/screenshots/${kind}?t=${Date.now()}">`;openModal()}
async function openSubmitConfirmation(id){shownShotTaskId=id;shownShotKind='form';const task=tasks.find(item=>item.id===id);const orders=task?.data?.orderCandidates||[];$('modal-title').textContent='核对并创建工单';$('modal-subtitle').textContent='请逐项核对；只有点击“确认并创建工单”后才会提交兴趣岛工单。';$('modal-body').innerHTML=`<img class="mx-auto max-w-full rounded border" src="/api/photo-complaints/${id}/screenshots/form?t=${Date.now()}" alt="兴趣岛已填写投诉表单"><div class="mt-5 flex flex-wrap justify-end gap-2"><button id="adjust-main-order" class="btn btn-secondary" ${orders.length?'':'disabled'}>调整主订单ID</button><button id="dismiss-submit" class="btn btn-secondary">稍后核对</button><button id="confirm-create" class="btn btn-primary">确认并创建工单</button></div>`;openModal();$('adjust-main-order').onclick=()=>showMainOrderAdjuster(id);$('dismiss-submit').onclick=closeModal;$('confirm-create').onclick=async()=>{if(!confirm('确认已核对全部字段并创建兴趣岛工单？此操作不可撤销。'))return;const button=$('confirm-create');button.disabled=true;try{const issued=await api(`/api/photo-complaints/${id}/confirmation-token`,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});await api(`/api/photo-complaints/${id}/submit`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:issued.data.token})});closeModal();await loadTasks()}catch(error){button.disabled=false;alert(error.message)}}}
function showMainOrderAdjuster(id){const t=tasks.find(x=>x.id===id),d=t?.data||{},orders=d.orderCandidates||[];$('modal-title').textContent='调整主订单ID';$('modal-subtitle').textContent='仅显示本次从兴趣岛实际读取到的订单。保存后会修改云端真实表单并重新生成核对截图。';$('modal-body').innerHTML=`<form id="main-order-form" class="space-y-4"><label class="block"><span class="field-label">主投诉订单ID *</span><select name="mainOrderId" class="field-control">${orders.map(o=>`<option value="${esc(o.id)}" ${String(o.id)===String(d.mainOrderId)?'selected':''}>${esc(o.name||o.id)}</option>`).join('')}</select></label><p class="rounded bg-blue-50 p-3 text-sm text-blue-700">关联订单ID仍保持为空；保存不会提交工单。</p><div class="flex justify-end gap-2"><button type="button" class="btn btn-secondary" data-action="open-submit" data-task-id="${esc(id)}">返回截图核对</button><button class="btn btn-primary">保存并重新生成截图</button></div></form>`;$('main-order-form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{const mainOrderId=new FormData(e.target).get('mainOrderId');await api(`/api/photo-complaints/${id}/main-order`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({mainOrderId})});await loadTasks();openSubmitConfirmation(id)}catch(err){alert(err.message)}finally{button.disabled=false}}}
async function action(id,name){try{await api(`/api/photo-complaints/${id}/${name}`,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});await loadTasks()}catch(e){msg(e.message,true)}}
async function removeTask(id){if(!confirm('确认取消此任务？'))return;await api(`/api/photo-complaints/${id}`,{method:'DELETE'});await loadTasks()}
function openModal(){$('modal').classList.remove('hidden');$('modal').classList.add('flex')}function closeModal(){if(shownShotKind==='form'&&shownShotTaskId&&tasks.find(t=>t.id===shownShotTaskId)?.status==='awaiting_confirmation'){dismissedConfirmations.add(shownShotTaskId);sessionStorage.setItem('photoComplaintDismissedConfirmations',JSON.stringify([...dismissedConfirmations]))}$('modal').classList.add('hidden');$('modal').classList.remove('flex');shownShotTaskId='';shownShotKind='';activeReviewBatch=[];activeReviewIndex=-1}
$('tasks').addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const {action:kind,taskId,batchId,name}=button.dataset;if(kind==='batch-review')startBatchReview(batchId);else if(kind==='review')review(taskId);else if(kind==='show-shot')showShot(taskId,button.dataset.kind);else if(kind==='task-action')action(taskId,name);else if(kind==='open-submit')openSubmitConfirmation(taskId);else if(kind==='remove-task')removeTask(taskId)});
$('modal-body').addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const {action:kind,taskId}=button.dataset;if(kind==='move-batch')moveBatchReview(Number(button.dataset.delta));else if(kind==='close-modal')closeModal();else if(kind==='open-submit')openSubmitConfirmation(taskId)});
$('modal-close').onclick=closeModal;$('refresh').onclick=loadTasks;$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})}finally{location.href='/login'}};
$('files').onchange=()=>{$('selection').textContent=`已选择 ${$('files').files.length} 张`};$('upload').onclick=async()=>{const files=[...$('files').files];if(!files.length||files.length>10)return msg('请选择1至10张图片',true);const fd=new FormData();files.forEach(f=>fd.append('images',f));try{$('upload').disabled=true;const result=await api('/api/photo-complaints',{method:'POST',body:fd});const batchId=result.data?.[0]?.data?.batchId;if(batchId){lastUploadedBatchId=batchId;sessionStorage.setItem('photoComplaintLastBatch',batchId)}msg(`本次 ${files.length} 张图片已进入识别队列`);$('files').value='';$('selection').textContent='';await loadTasks()}catch(e){msg(e.message,true)}finally{$('upload').disabled=false}};
setInterval(()=>loadTasks().catch(()=>{}),4000);loadSession().catch(()=>location.href='/login');
</script></body></html>
