<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 客满运营台</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto flex min-h-screen w-full max-w-md flex-col items-center justify-center gap-6 px-4">
      <div class="w-full rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="mb-6 text-center">
          <h1 class="text-xl font-semibold tracking-normal">客满运营台</h1>
          <p class="mt-1 text-sm text-slate-500">请先登录以继续使用</p>
        </div>
        <form id="loginForm" class="space-y-4">
          <label class="block">
            <span class="text-sm font-medium text-slate-700">用户名</span>
            <input id="username" name="username" autocomplete="username" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100" placeholder="请输入用户名" required>
          </label>
          <label class="block">
            <span class="text-sm font-medium text-slate-700">密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100" placeholder="请输入密码" required>
          </label>
          <button id="submitBtn" type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-sky-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-sky-700 disabled:cursor-not-allowed disabled:bg-slate-300">
            <span>登录</span>
          </button>
          <p id="hint" class="min-h-5 text-center text-sm text-rose-600"></p>
        </form>
      </div>
      <p class="text-xs text-slate-400">仅授权人员可访问，登录后请妥善保管账号。</p>
    </main>

    <script>
      const form = document.querySelector("#loginForm");
      const submitBtn = document.querySelector("#submitBtn");
      const hint = document.querySelector("#hint");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = document.querySelector("#username").value.trim();
        const password = document.querySelector("#password").value;
        if (!username || !password) {
          hint.textContent = "请输入用户名和密码";
          return;
        }
        submitBtn.disabled = true;
        submitBtn.querySelector("span").textContent = "登录中...";
        hint.textContent = "";
        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const payload = await response.json();
          if (!response.ok || !payload.ok) throw new Error(payload.error || "登录失败");
          window.location.href = payload.user?.mustChangePassword ? "/change-password" : "/";
        } catch (error) {
          hint.textContent = error.message || "登录失败";
          submitBtn.disabled = false;
          submitBtn.querySelector("span").textContent = "登录";
        }
      });
    </script>
  </body>
</html>
