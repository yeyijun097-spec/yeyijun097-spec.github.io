<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>修改初始密码 · 客满运营台</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/glass-theme.css?v=20260801-1">
  </head>
  <body class="glass-simple-page password-page">
    <main class="glass-simple-shell flex min-h-screen max-w-md items-center px-0 py-6">
      <section class="glass-card w-full p-6">
        <h1 class="text-xl font-semibold">设置新密码</h1>
        <p class="mt-2 text-sm text-slate-500">首次登录必须修改随机初始密码。新密码至少 10 位。</p>
        <form id="form" class="mt-6 space-y-4">
          <label class="block">
            <span class="text-sm font-medium text-slate-700">新密码</span>
            <input id="password" type="password" autocomplete="new-password" minlength="10" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100">
          </label>
          <label class="block">
            <span class="text-sm font-medium text-slate-700">确认新密码</span>
            <input id="confirm" type="password" autocomplete="new-password" minlength="10" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100">
          </label>
          <button id="submit" type="submit" class="glass-primary w-full px-4 py-2.5 text-sm font-medium text-white hover:brightness-105 disabled:opacity-60">保存并进入系统</button>
          <p id="hint" class="min-h-5 text-sm text-rose-600"></p>
        </form>
      </section>
    </main>
    <script>
      let csrfToken = "";
      fetch("/api/session", { cache: "no-store" }).then(async (response) => {
        if (response.status === 401) return window.location.replace("/login");
        const payload = await response.json();
        csrfToken = payload.csrfToken || "";
        if (!payload.user?.mustChangePassword) window.location.replace("/");
      });
      document.querySelector("#form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.querySelector("#password").value;
        const confirm = document.querySelector("#confirm").value;
        const hint = document.querySelector("#hint");
        if (password !== confirm) return void (hint.textContent = "两次输入的密码不一致");
        const button = document.querySelector("#submit");
        button.disabled = true;
        const response = await fetch("/api/account/password", {
          method: "POST",
          headers: { "content-type": "application/json", "x-csrf-token": csrfToken },
          body: JSON.stringify({ password })
        });
        const payload = await response.json().catch(() => ({}));
        if (response.ok && payload.ok) return window.location.replace("/");
        hint.textContent = payload.error || "密码修改失败";
        button.disabled = false;
      });
    </script>
  </body>
</html>
