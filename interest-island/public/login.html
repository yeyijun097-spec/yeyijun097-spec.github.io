<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 客满运营台</title>
    <link rel="stylesheet" href="/tailwind.css">
    <style>
      :root {
        color-scheme: light;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        margin: 0;
        color: #172554;
        background:
          radial-gradient(circle at 14% 82%, rgba(96, 165, 250, .32), transparent 28rem),
          radial-gradient(circle at 88% 16%, rgba(196, 181, 253, .38), transparent 25rem),
          linear-gradient(135deg, #f8fbff 0%, #eef6ff 47%, #e8edff 100%);
      }

      .login-page {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100svh;
        overflow: hidden;
        place-items: center;
        padding: 2rem 1.25rem;
      }

      .login-page::before,
      .login-page::after {
        position: fixed;
        z-index: -2;
        width: min(46vw, 44rem);
        aspect-ratio: 1;
        border-radius: 999px;
        content: "";
        filter: blur(2px);
        pointer-events: none;
      }

      .login-page::before {
        top: -20rem;
        right: -15rem;
        background: radial-gradient(circle, rgba(167, 139, 250, .30), transparent 68%);
      }

      .login-page::after {
        bottom: -24rem;
        left: -16rem;
        background: radial-gradient(circle, rgba(59, 130, 246, .22), transparent 68%);
      }

      .particle-canvas {
        position: fixed;
        z-index: -1;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .login-card {
        width: min(100%, 30rem);
        padding: clamp(2rem, 6vw, 3.25rem);
        border: 1px solid rgba(255, 255, 255, .78);
        border-radius: 2rem;
        background: linear-gradient(145deg, rgba(255, 255, 255, .78), rgba(239, 246, 255, .52));
        box-shadow: 0 1.5rem 4.5rem rgba(48, 90, 170, .18), inset 0 1px 0 rgba(255, 255, 255, .9);
        -webkit-backdrop-filter: blur(20px) saturate(145%);
        backdrop-filter: blur(20px) saturate(145%);
      }

      .login-header { margin-bottom: 2rem; text-align: center; }

      .login-header h1 {
        margin: 0;
        color: #172554;
        font-size: clamp(1.7rem, 4vw, 2rem);
        font-weight: 750;
        letter-spacing: .035em;
      }

      .login-header p {
        margin: .65rem 0 0;
        color: #64748b;
        font-size: .95rem;
      }

      .login-form { display: grid; gap: 1.1rem; }

      .field { display: grid; gap: .5rem; }

      .field-label {
        color: #334155;
        font-size: .9rem;
        font-weight: 650;
      }

      .field input {
        width: 100%;
        min-height: 3.25rem;
        border: 1px solid rgba(148, 163, 184, .42);
        border-radius: .9rem;
        outline: none;
        background: rgba(255, 255, 255, .52);
        color: #172554;
        padding: .75rem 1rem;
        font: inherit;
        font-size: .95rem;
        transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
      }

      .field input::placeholder { color: #94a3b8; }

      .field input:hover { border-color: rgba(96, 165, 250, .58); }

      .field input:focus {
        border-color: #6366f1;
        background: rgba(255, 255, 255, .82);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, .14), 0 .75rem 1.5rem rgba(99, 102, 241, .10);
      }

      .login-button {
        min-height: 3.25rem;
        margin-top: .35rem;
        border: 0;
        border-radius: .9rem;
        background: linear-gradient(100deg, #3b82f6 0%, #5b76f2 48%, #8b5cf6 100%);
        box-shadow: 0 .85rem 1.7rem rgba(79, 112, 234, .28), inset 0 1px 0 rgba(255, 255, 255, .3);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: .08em;
        transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      }

      .login-button:hover:not(:disabled) {
        box-shadow: 0 1rem 2rem rgba(79, 112, 234, .36), inset 0 1px 0 rgba(255, 255, 255, .32);
        filter: brightness(1.04);
        transform: translateY(-1px);
      }

      .login-button:focus-visible { outline: 3px solid rgba(59, 130, 246, .5); outline-offset: 3px; }
      .login-button:active:not(:disabled) { transform: translateY(0); }
      .login-button:disabled { cursor: not-allowed; filter: grayscale(.25) opacity(.68); }

      .login-hint {
        min-height: 1.25rem;
        margin: -.2rem 0 0;
        color: #be123c;
        font-size: .875rem;
        text-align: center;
      }

      .login-footer {
        margin: 1.65rem 0 0;
        color: #64748b;
        font-size: .78rem;
        line-height: 1.6;
        text-align: center;
      }

      @media (max-width: 420px) {
        .login-page { padding: 1rem; }
        .login-card { padding: 2rem 1.4rem; border-radius: 1.5rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="login-page">
      <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>
      <section class="login-card" aria-labelledby="loginTitle">
        <header class="login-header">
          <h1 id="loginTitle">客满运营台</h1>
          <p>请先登录以继续使用</p>
        </header>
        <form id="loginForm" class="login-form">
          <label class="field">
            <span class="field-label">用户名</span>
            <input id="username" name="username" autocomplete="username" placeholder="请输入用户名" required>
          </label>
          <label class="field">
            <span class="field-label">密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          </label>
          <button id="submitBtn" class="login-button" type="submit"><span>登录</span></button>
          <p id="hint" class="login-hint" aria-live="polite"></p>
        </form>
        <p class="login-footer">仅授权人员可访问，登录后请妥善保管账号。</p>
      </section>
    </main>

    <script>
      const form = document.querySelector("#loginForm");
      const submitBtn = document.querySelector("#submitBtn");
      const hint = document.querySelector("#hint");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = document.querySelector("#username").value.trim();
        const password = document.querySelector("#password").value;
        if (!username || !password) {
          hint.textContent = "请输入用户名和密码";
          return;
        }
        submitBtn.disabled = true;
        submitBtn.querySelector("span").textContent = "登录中...";
        hint.textContent = "";
        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const payload = await response.json();
          if (!response.ok || !payload.ok) throw new Error(payload.error || "登录失败");
          window.location.href = payload.user?.mustChangePassword ? "/change-password" : "/";
        } catch (error) {
          hint.textContent = error.message || "登录失败";
          submitBtn.disabled = false;
          submitBtn.querySelector("span").textContent = "登录";
        }
      });

      const particleCanvas = document.querySelector("#particleCanvas");
      const particleContext = particleCanvas.getContext("2d");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let particles = [];
      let frameId = null;
      let isVisible = !document.hidden;

      function createParticles() {
        const count = window.innerWidth < 640 ? 18 : 34;
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: 1 + Math.random() * 2,
          alpha: .16 + Math.random() * .34,
          speed: .08 + Math.random() * .18,
          drift: (Math.random() - .5) * .1
        }));
      }

      function resizeParticles() {
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        particleCanvas.width = Math.round(window.innerWidth * scale);
        particleCanvas.height = Math.round(window.innerHeight * scale);
        particleCanvas.style.width = `${window.innerWidth}px`;
        particleCanvas.style.height = `${window.innerHeight}px`;
        createParticles();
      }

      function drawParticles() {
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        particleContext.setTransform(scale, 0, 0, scale, 0, 0);
        particleContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
        for (const particle of particles) {
          particleContext.beginPath();
          particleContext.fillStyle = `rgba(99, 102, 241, ${particle.alpha})`;
          particleContext.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          particleContext.fill();
          if (!reducedMotion.matches) {
            particle.y -= particle.speed;
            particle.x += particle.drift;
            if (particle.y < -6) particle.y = window.innerHeight + 6;
            if (particle.x < -6) particle.x = window.innerWidth + 6;
            if (particle.x > window.innerWidth + 6) particle.x = -6;
          }
        }
        if (!reducedMotion.matches && isVisible) frameId = window.requestAnimationFrame(drawParticles);
      }

      function renderParticles() {
        if (frameId) window.cancelAnimationFrame(frameId);
        drawParticles();
      }

      window.addEventListener("resize", () => {
        resizeParticles();
        renderParticles();
      });

      reducedMotion.addEventListener("change", renderParticles);
      document.addEventListener("visibilitychange", () => {
        isVisible = !document.hidden;
        if (isVisible) renderParticles();
        else if (frameId) window.cancelAnimationFrame(frameId);
      });

      resizeParticles();
      renderParticles();
    </script>
  </body>
</html>
